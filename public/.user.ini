; PHP Configuration Override for Image Upload
; This file overrides PHP settings for the application

; Maximum size of an uploaded file (set to 100MB for large image uploads)
upload_max_filesize = 100M

; Maximum size of POST data (must be larger than upload_max_filesize)
post_max_size = 110M

; Maximum execution time (in seconds, 0 for unlimited)
max_execution_time = 300

; Maximum input time (in seconds)
max_input_time = 300

; Memory limit (set to 512M for image processing)
memory_limit = 512M
